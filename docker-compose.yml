version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - db
      - ai-service
    networks:
      - talentbridge-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    networks:
      - talentbridge-network

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: talentbridge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - talentbridge-network

volumes:
  postgres_data:

networks:
  talentbridge-network:
    driver: bridge
